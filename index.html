  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px;
            padding:9px 20px; background:#151821; border-bottom:1px solid #2c313a; flex:0 0 auto; }

  .switch { font-size:14px; font-weight:600; color:#4f9cf9; cursor:pointer; user-select:none;
            background:none; border:none; padding:2px 0; border-bottom:1px solid transparent;
            font-family:inherit; }
  .switch:hover, .switch:focus-visible { border-bottom-color:#4f9cf9; outline:none; }
  .switch .arrow { font-weight:400; margin-left:5px; }
  .stage { position:relative; flex:1 1 auto; min-height:0; }
  /* Both frames stay laid out and are swapped with visibility/z-index rather
     than display:none — hiding by display throws away the inactive report's
     layout and rebuilds all 585 rows on every switch, which makes toggling
     visibly expensive. This way a switch is just a compositing change. */
  iframe { position:absolute; inset:0; width:100%; height:100%; border:none; background:#0f1115;
           visibility:hidden; z-index:0; }
  iframe.active { visibility:visible; z-index:1; }
  .loading { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
             color:#9aa0a6; font-size:14px; }
  .loading.on { display:flex; }

  /* --- added by publish_artifact.py, for the shared/published copy --- */
  /* The host paints its own ground behind the page, so height:100% alone can
     collapse if the frame's html element is unsized. 100vh is the belt. */

  .stamp { color:#6f7681; font-size:12px; margin-left:14px; white-space:nowrap; }
  .stamp b { color:#9aa0a6; font-weight:600; }
  .loading { text-align:center; padding:0 24px; line-height:1.6; }
  @media (max-width:620px) { .stamp { display:block; margin:2px 0 0; } }

<script>
const VIEWS = {
  screener: { frame: 'frameScreener', label: 'Daily Swing Screener' },
  earnings: { frame: 'frameEarnings', label: 'Earnings Calendar' }
};
let current = null;

function show(key) {
  if (key === current) return;
  for (const [k, v] of Object.entries(VIEWS)) {
    document.getElementById(v.frame).classList.toggle('active', k === key);
  }
  current = key;
  const other = key === 'screener' ? 'earnings' : 'screener';
  document.getElementById('currentLabel').textContent = VIEWS[key].label;
  document.getElementById('switchLink').innerHTML =
    VIEWS[other].label + '<span class="arrow">&rarr;</span>';
  document.title = VIEWS[key].label + ' NSE Daily Swing Dashboard';
  // A sandboxed frame can hold an opaque origin, where replaceState throws.
  // The hash is a convenience; never let it break the switch.
  try {
    if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);
  } catch (e) { /* opaque origin */ }
}

document.getElementById('switchLink').addEventListener('click', () => {
  show(current === 'screener' ? 'earnings' : 'screener');
});

// Each report is embedded gzipped + base64'd to keep the published page small
// enough to share. DecompressionStream is native in Chrome 80+, Safari 16.4+
// and Firefox 113+; older browsers get a plain message rather than a blank page.
async function inflate(id) {
  const b64 = document.getElementById(id).textContent.trim();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

(async () => {
  const loading = document.getElementById('loading');
  loading.classList.add('on');
  try {
    const [screener, earnings] = await Promise.all([
      inflate('docScreener'), inflate('docEarnings')
    ]);
    document.getElementById('frameScreener').srcdoc = screener;
    document.getElementById('frameEarnings').srcdoc = earnings;
  } catch (e) {
    loading.textContent =
      'This dashboard needs a current browser (Chrome 80+, Safari 16.4+, Firefox 113+).';
    return;
  }
  loading.classList.remove('on');
  show(location.hash.slice(1) === 'earnings' ? 'earnings' : 'screener');
})();
</script>
