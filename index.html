<script>
const VIEWS = {
  screener: { frame: 'frameScreener', label: 'WISH SWING Screener' },
  earnings: { frame: 'frameEarnings', label: 'Earnings Calendar' }
};
let current = null;

function show(key) {
  if (key === current) return;
  for (const [k, v] of Object.entries(VIEWS)) {
    document.getElementById(v.frame).classList.toggle('active', k === key);
  }
  current = key;
  const other = key === 'screener' ? 'earnings' : 'screener';
  document.getElementById('currentLabel').textContent = VIEWS[key].label;
  document.getElementById('switchLink').innerHTML =
    VIEWS[other].label + '<span class="arrow">&rarr;</span>';
  document.title = VIEWS[key].label + ' WISH SWING';
  // A sandboxed frame can hold an opaque origin, where replaceState throws.
  // The hash is a convenience; never let it break the switch.
  try {
    if (location.hash.slice(1) !== key) history.replaceState(null, '', '#' + key);
  } catch (e) { /* opaque origin */ }
}

document.getElementById('switchLink').addEventListener('click', () => {
  show(current === 'screener' ? 'earnings' : 'screener');
});

// Each report is embedded gzipped + base64'd to keep the published page small
// enough to share. DecompressionStream is native in Chrome 80+, Safari 16.4+
// and Firefox 113+; older browsers get a plain message rather than a blank page.
async function inflate(id) {
  const b64 = document.getElementById(id).textContent.trim();
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

(async () => {
  const loading = document.getElementById('loading');
  loading.classList.add('on');
  try {
    const [screener, earnings] = await Promise.all([
      inflate('docScreener'), inflate('docEarnings')
    ]);
    document.getElementById('frameScreener').srcdoc = screener;
    document.getElementById('frameEarnings').srcdoc = earnings;
  } catch (e) {
    loading.textContent =
      'This dashboard needs a current browser (Chrome 80+, Safari 16.4+, Firefox 113+).';
    return;
  }
  loading.classList.remove('on');
  show(location.hash.slice(1) === 'earnings' ? 'earnings' : 'screener');
})();
</script>
